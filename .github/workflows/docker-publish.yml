name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly rebuild of the newest release, so security fixes to the base
    # image reach people who are not waiting for a new version of this code.
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ref=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          else
            ref="${{ github.ref }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building $ref"

  test:
    needs: target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: [target, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.ref }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # "latest" tracks the newest release, not the tip of main. A push to
          # main publishes only the "main" tag, so pulling latest can never
          # hand someone an untagged development build.
          flavor: |
            latest=false
          # A scheduled run rebuilds the newest release and moves only "latest".
          # Version tags stay immutable: 0.1.4 must always be the same image.
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
