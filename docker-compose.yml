services:
  proxyseerr:
    image: ghcr.io/ronfburgundy/proxyseerr:latest
    # To build locally instead of pulling: docker compose up --build
    build: .
    container_name: proxyseerr
    ports:
      - "5000:5000"   # Sonarr side  - point Seerr's Sonarr server here
      - "5001:5001"   # Radarr side  - point Seerr's Radarr server here
    environment:
      # Required. Generate with: openssl rand -hex 24
      # Enter the same value as the API key on both servers in Seerr.
      PROXY_API_KEY: "${PROXY_API_KEY:?set PROXY_API_KEY in .env}"

      # --- Sonarr pair (omit all four to run Radarr only) ---
      ENGLISH_SONARR_URL: "${ENGLISH_SONARR_URL}"
      ENGLISH_SONARR_API_KEY: "${ENGLISH_SONARR_API_KEY}"
      ANIME_SONARR_URL: "${ANIME_SONARR_URL}"
      ANIME_SONARR_API_KEY: "${ANIME_SONARR_API_KEY}"

      # --- Radarr pair (omit all four to run Sonarr only) ---
      ENGLISH_RADARR_URL: "${ENGLISH_RADARR_URL}"
      ENGLISH_RADARR_API_KEY: "${ENGLISH_RADARR_API_KEY}"
      ANIME_RADARR_URL: "${ANIME_RADARR_URL}"
      ANIME_RADARR_API_KEY: "${ANIME_RADARR_API_KEY}"

      # --- Optional tuning ---
      # SONARR_PROXY_PORT: "5000"
      # RADARR_PROXY_PORT: "5001"
      # ANIME_ID_OFFSET: "1000000000"
      # ANIME_ROOT_FOLDER_MATCH: "anime"
      # ANIME_LABEL_PREFIX: "[Anime] "
      # LOG_LEVEL: "INFO"
    restart: unless-stopped
